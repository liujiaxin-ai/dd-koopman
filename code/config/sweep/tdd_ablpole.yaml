accelerator: auto
data:
  batch_size: 32
  dir_dataset: z_artifacts/data
  is_U2D: false
  is_separate_antennas: true
  num_workers: 0
  shuffle: true
  train_ratio: 0.9
deterministic: false
devices: 1
experiment_name: TDD_ABLPOLE
loss:
  name: NMSE
  params: {}
model:
  checkpoint_path: null
  is_separate_antennas: true
  name: DD_KOOP_TAP_TDD
  params:
    arl_hidden: 128
    arl_operation: multiply
    auxi_lambda: 0.5
    auxi_mode: complex
    blend_coherence_init: true
    blend_source: mean
    correction_scale: 1.0
    d_model: 160
    decomposition_scale: 8.0
    denoise_filters: 3
    depth: 4
    doppler_shrink: false
    dropout: 0.1
    ffn_scale: 2.0
    gated_correction: true
    heads: 8
    hist_len: 16
    input_conditioned_poles: false
    num_delay_taps: 300
    num_subcarriers: 300
    persistence_blend: true
    pred_len: 4
    use_delay_decomposition: false
    use_denoiser: true
    use_radius_conditioning: false
    use_revin: false
    use_tap_encoding: true
    warm_start: true
model_name: ABLPOLE
optimizer:
  name: Adam
  params:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    weight_decay: 0.0001
output_dir: z_artifacts/outputs/sweep/ABLPOLE
precision: '32'
prefix: TDD
scheduler:
  name: ReduceLROnPlateau
  params:
    cooldown: 3
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 4
    threshold: 0.0001
seed: 42
training:
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  early_stopping: true
  early_stopping_min_delta: 0.0001
  early_stopping_mode: min
  early_stopping_patience: 25
  enable_model_summary: true
  enable_progress_bar: true
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  monitor_metric: val_loss
  monitor_mode: min
  num_epochs: 240
  save_top_k: 1
