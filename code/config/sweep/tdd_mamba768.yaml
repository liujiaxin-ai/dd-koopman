accelerator: auto
data:
  batch_size: 8
  dir_dataset: z_artifacts/data
  is_U2D: false
  is_separate_antennas: true
  num_workers: 0
  shuffle: true
  train_ratio: 0.9
deterministic: false
devices: 1
experiment_name: TDD_MAMBA768
loss:
  name: NMSE
  params: {}
model:
  checkpoint_path: null
  is_separate_antennas: true
  name: MAMBACSP_TDD
  params:
    K: 300
    d_model: 768
    dropout: 0.1
    mamba_layers: 6
    patch_size: 4
    pred_len: 4
    prev_len: 16
    res_dim: 64
    res_layers: 4
    use_gpu: 0
model_name: MAMBA768
optimizer:
  name: Adam
  params:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    weight_decay: 0.0001
output_dir: z_artifacts/outputs/sweep/MAMBA768
precision: '32'
prefix: TDD
scheduler:
  name: ReduceLROnPlateau
  params:
    cooldown: 3
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 4
    threshold: 0.0001
seed: 42
training:
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  early_stopping: true
  early_stopping_min_delta: 0.0001
  early_stopping_mode: min
  early_stopping_patience: 3
  enable_model_summary: true
  enable_progress_bar: true
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  monitor_metric: val_loss
  monitor_mode: min
  num_epochs: 8
  save_top_k: 1
